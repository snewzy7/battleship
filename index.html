<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Pantry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>The Pantry</h1>
    <p id="status">protect your snacks. raid theirs.</p>
  </header>

  <main>
    <section class="boards">
      <div class="board-wrap">
        <h2>Your Pantry</h2>
        <div class="grid-outer">
          <div class="corner"></div>
          <div class="col-labels" id="player-col-labels"></div>
          <div class="row-labels" id="player-row-labels"></div>
          <div class="grid" id="player-grid"></div>
        </div>
      </div>
      <div class="board-wrap">
        <h2>Roommate's Pantry</h2>
        <div class="grid-outer">
          <div class="corner"></div>
          <div class="col-labels" id="enemy-col-labels"></div>
          <div class="row-labels" id="enemy-row-labels"></div>
          <div class="grid" id="enemy-grid"></div>
        </div>
      </div>
    </section>

    <aside class="side">
      <section class="chat" id="chat">
        <div class="chat-head"><span class="avatar">r</span><span>the roommate</span></div>
        <ul id="chat-log"></ul>
      </section>
      <section class="fleet-panel" id="player-fleet">
        <h2>Your Pantry</h2>
        <ul class="fleet-list"></ul>
        <p class="fleet-stats"></p>
      </section>
      <section class="fleet-panel" id="enemy-fleet">
        <h2>Roommate's Pantry</h2>
        <ul class="fleet-list"></ul>
        <p class="fleet-stats"></p>
      </section>
      <section class="controls">
        <h2 id="controls-title">Stock Your Pantry</h2>
        <button id="rotate-btn" type="button">Rotate (H)</button>
        <button id="random-btn" type="button">Stock randomly</button>
        <button id="reset-btn" type="button">Clear shelves</button>
        <button id="start-btn" type="button" hidden>Start</button>
      </section>

      <section class="log-panel">
        <h2>Battle Log</h2>
        <ul id="log"></ul>
      </section>
    </aside>
  </main>

  <div id="flash"></div>

  <div id="overlay" hidden>
    <div class="overlay-card">
      <h2 id="overlay-title"></h2>
      <p id="overlay-summary"></p>
      <p id="overlay-quote"></p>
      <button id="overlay-btn" type="button">Run It Back</button>
    </div>
  </div>

  <script src="ai.js"></script>
  <script src="roommate.js"></script>
  <script src="game.js"></script>
</body>
</html>
